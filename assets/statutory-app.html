<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Union ERP — الوحدة النظامية والمحاسبية</title>
<style>
:root { color-scheme: dark; --bd: #1e293b; --panel: #0d1729; --ink: #e2e8f0; --muted: #94a3b8; --gold: #fcd34d; --green: #6ee7b7; --red: #fca5a5; --blue: #93c5fd; }
* { box-sizing: border-box; }
body { margin: 0; background: #0b1220; color: var(--ink); font-family: "Segoe UI", Tahoma, Arial, sans-serif; line-height: 1.7; font-size: 14px; }
a { color: var(--blue); }
.app { display: flex; min-height: 100vh; }
.nav { width: 250px; flex: 0 0 250px; background: #0a1120; border-left: 1px solid var(--bd); padding: 16px 14px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.brand { font-size: 15px; font-weight: 800; color: #f8fafc; margin-bottom: 2px; }
.brand small { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
.navgroup { margin-top: 14px; font-size: 11px; color: #64748b; letter-spacing: .5px; }
.nav button { display: block; width: 100%; text-align: right; background: none; border: 0; color: #cbd5e1; padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-family: inherit; margin-top: 2px; }
.nav button:hover { background: #16233a; color: #fef3c7; }
.nav button.active { background: #1c1917; color: var(--gold); font-weight: 700; }
.nav .foot { margin-top: 18px; font-size: 11px; color: #64748b; border-top: 1px solid var(--bd); padding-top: 10px; }
.main { flex: 1; min-width: 0; padding: 18px 20px 60px; }
.topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--bd); padding-bottom: 12px; margin-bottom: 16px; }
.topbar h1 { font-size: 18px; margin: 0; color: #f8fafc; }
.topbar .sub { font-size: 11px; color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
h2 { font-size: 15px; margin: 22px 0 10px; color: var(--gold); }
h3 { font-size: 13px; margin: 14px 0 8px; color: var(--blue); }
.panel { border: 1px solid var(--bd); border-radius: 16px; background: var(--panel); padding: 14px; margin-bottom: 12px; }
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
@media (max-width: 1050px) { .grid2 { grid-template-columns: 1fr; } .nav { position: static; height: auto; width: 100%; flex: 1 1 100%; } .app { flex-wrap: wrap; } }
.kpi { border: 1px solid var(--bd); border-radius: 14px; padding: 11px 12px; background: #0d1729; }
.kpi .n { font-size: 19px; font-weight: 800; color: #fef3c7; }
.kpi .l { font-size: 11px; color: var(--muted); }
.chip { display: inline-block; border: 1px solid var(--bd); background: #111c2f; border-radius: 999px; padding: 3px 10px; font-size: 11px; color: var(--blue); margin: 2px 2px 2px 0; }
.chip.ok { color: var(--green); border-color: #065f46; }
.chip.bad { color: var(--red); border-color: #7f1d1d; }
.chips { margin: 8px 0; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { border-bottom: 1px solid #16223a; padding: 6px 8px; text-align: right; vertical-align: top; }
th { color: var(--blue); font-weight: 600; background: #0b1526; position: sticky; top: 0; }
tbody tr:hover { background: #101d33; }
.scroll { overflow: auto; border: 1px solid var(--bd); border-radius: 12px; }
.tot td { font-weight: 800; color: #fef3c7; background: #101c30; }
input, select, textarea, button { font-family: inherit; font-size: 12px; }
input, select, textarea { background: #0a1322; border: 1px solid var(--bd); color: var(--ink); border-radius: 10px; padding: 7px 9px; }
input:focus, select:focus { outline: 1px solid #334155; }
button.act { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; border-radius: 10px; padding: 7px 12px; cursor: pointer; }
button.act:hover { background: #26364f; }
button.act.primary { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
button.act.gold { background: #78350f; border-color: #b45309; color: #fde68a; }
button.act.ghost { background: transparent; }
button.act.small { padding: 4px 9px; font-size: 11px; }
button.act:disabled { opacity: .5; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > label { font-size: 11px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 11px; color: var(--muted); }
.verdict { border-radius: 12px; padding: 10px 12px; border: 1px solid var(--bd); background: #101c30; margin: 8px 0; }
.verdict.BLOCKED { border-color: #7f1d1d; background: #1c1014; }
.verdict.WARNED { border-color: #92400e; background: #1d1710; }
.verdict.INFO, .verdict.ACCEPTED { border-color: #065f46; background: #0d1c18; }
.verdict strong { color: #fef3c7; }
.viol { border: 1px solid var(--bd); border-right: 3px solid #64748b; border-radius: 10px; padding: 8px 10px; margin: 6px 0; background: #0b1526; font-size: 12px; }
.viol.blocked { border-right-color: #ef4444; }
.viol.warned { border-right-color: #f59e0b; }
.viol.info { border-right-color: #3b82f6; }
.viol .ar { color: #cbd5e1; margin-top: 3px; }
.viol .rid { color: #64748b; font-size: 11px; margin-top: 3px; }
.muted { color: var(--muted); }
.small { font-size: 11px; }
.mono { font-family: Consolas, "Courier New", monospace; direction: ltr; display: inline-block; }
.empty { color: var(--muted); padding: 12px; text-align: center; font-size: 12px; }
.notice { border-right: 3px solid var(--gold); background: #1a1608; border-radius: 10px; padding: 9px 11px; margin: 8px 0; font-size: 12px; }
.notice.bad { border-right-color: #ef4444; background: #1a0f12; }
.lines { display: grid; gap: 6px; }
.line { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1.4fr auto; gap: 6px; align-items: center; }
.line input, .line select { width: 100%; }
@media (max-width: 860px) { .line { grid-template-columns: 1fr 1fr; } }
.toast { position: fixed; inset-inline-start: 18px; bottom: 18px; background: #111c2f; border: 1px solid #334155; color: #e2e8f0; border-radius: 12px; padding: 10px 14px; font-size: 12px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 50; max-width: 420px; }
.toast.show { opacity: 1; }
.bar { height: 8px; border-radius: 999px; background: #16223a; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80); }
.pill { font-size: 10px; border: 1px solid var(--bd); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
.pill.POSTED { color: var(--green); border-color: #065f46; }
.pill.DRAFT { color: var(--gold); border-color: #78350f; }
.pill.REVERSED { color: var(--blue); border-color: #1e40af; }
details summary { cursor: pointer; color: var(--blue); font-size: 12px; }
.article { border: 1px solid var(--bd); border-radius: 12px; padding: 9px 11px; margin-bottom: 7px; background: #0a1322; }
.article .no { color: var(--gold); font-weight: 800; font-size: 12px; }
.article .txt { font-size: 12px; color: #cbd5e1; margin-top: 4px; max-height: 90px; overflow: auto; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.sim { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
</style>
</head>
<body>
<div class="app">
  <aside class="nav">
    <div class="brand">Union ERP<small>البرنامج المحاسبي + لوحة النظام الأساسي</small></div>
    <div class="navgroup">المحاسبة (النواة)</div>
    <button data-view="overview">لوحة المعلومات</button>
    <button data-view="entries">القيود اليومية</button>
    <button data-view="chart">دليل الحسابات (118)</button>
    <button data-view="trial">ميزان المراجعة</button>
    <button data-view="subledger">الأطراف التح  يلية</button>
    <button data-view="chain">سلسلة التحقق وسجل التدقيق</button>
    <div class="navgroup">اللائحة المالية</div>
    <button data-view="financial">بوابة اللائحة المالية</button>
    <div class="navgroup">النظام الأساسي</div>
    <button data-view="statute">لوحة النظام الأساسي</button>
    <button data-view="simulators">محاكيا الفحص (حكامة/عضوية)</button>
    <div class="foot" id="navFoot"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="viewTitle">لوحة المعلومات</h1>
        <div class="sub" id="viewSub"></div>
      </div>
      <div class="tools">
        <label class="small muted">مرحلة بوابة اللائحة</label>
        <select id="stage">
          <option value="SHADOW">SHADOW — رصد صامت</option>
          <option value="AUDIT">AUDIT — تدقيق ظاهر</option>
          <option value="WARN">WARN — تحذير</option>
          <option value="ENFORCE" selected>ENFORCE — منع كامل</option>
        </select>
        <button class="act ghost" id="reload">تحديث البيانات</button>
      </div>
    </div>
    <section id="view"></section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const view = () => $('view');
const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const num = (value) => Number(value || 0).toLocaleString('en-US');
const money = (major) => Number(major || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const today = () => new Date().toISOString().slice(0, 10);

const S = {
  stage: 'ENFORCE',
  route: 'overview',
  demo: null,
  chart: [],
  entries: [],
  trial: null,
  chain: null,
  audit: [],
  calibration: null,
  finCoverage: null,
  statuteCoverage: null,
  enforcement: null,
  defaults: null,
  lastEntryId: null,
  lines: [],
  articlesShown: 12,
  articleQuery: '',
  chapterId: 'ALL',
};

function toast(message, bad) {
  const box = $('toast');
  box.textContent = message;
  box.style.borderColor = bad ? '#7f1d1d' : '#334155';
  box.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => box.classList.remove('show'), 4200);
}

async function api(path, options) {
  const joiner = path.includes('?') ? '&' : '?';
  const url = path.startsWith('/api/accounting') ? `${path}${joiner}stage=${S.stage}` : path;
  const headers = new Headers(options?.headers);
  // اتبع هوية العرض نفسها التي يستخدمها عميل البرنامج، مع إبقاء قرار القبول بيد حارس API.
  // في الوضع الصارم لن تُقبل هذه الترويسة؛ يلزم JWT صالح كما هو الحال في باقي النظام.
  let userId = 'usr-mohamed-abdallah';
  try { userId = localStorage.getItem('union_current_user') || userId; } catch { /* تخزين غير متاح */ }
  headers.set('x-user-id', userId);
  let response;
  try {
    response = await fetch(url, { ...options, headers });
  } catch (error) {
    toast('تعذّر الاتصال بالخادم المحلي — تأكد أن البرنامج يعمل.', true);
    throw error;
  }
  const payload = await response.json().catch(() => ({}));
  if (!response.ok && payload.errorAr) toast(payload.errorAr, true);
  return payload;
}

const post = (path, body) => api(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });

/* ------------------------------------------------------------------ التحميل */
async function loadAll() {
  S.demo = await api('/api/statutory/state');
  const [chart, entries, trial, chain, audit, finCal, finCov, stCov, enf] = await Promise.all([
    api('/api/accounting/accounts'),
    api('/api/accounting/entries'),
    api('/api/accounting/trial-balance'),
    api('/api/accounting/chain'),
    api('/api/statutory/audit'),
    api('/api/financial/calibration'),
    api('/api/financial/coverage'),
    api('/api/statute/coverage'),
    api('/api/statute/enforcement'),
  ]);
  S.chart = chart.accounts || [];
  S.entries = entries.entries || [];
  S.trial = trial;
  S.chain = chain;
  S.audit = audit.entries || [];
  S.calibration = finCal.thresholds || [];
  S.finCoverage = finCov;
  S.statuteCoverage = stCov;
  S.enforcement = enf;
  if (!S.defaults) S.defaults = await api('/api/statutory/defaults');
  $('navFoot').innerHTML = `<span class="mono">${esc((S.demo.accounting.provenance.sourceFileSha256 || '').slice(0, 10))}…</span><br>دليل الحسابات: ${num(S.demo.accounting.stats.accounts)} حساباً<br>الوثيقة: ${esc(S.demo.document.version || '')}`;
  renderNavState();
}

function renderNavState() {
  document.querySelectorAll('.nav button').forEach((button) => {
    button.classList.toggle('active', button.dataset.view === S.route);
  });
}

/* ------------------------------------------------------------------ عناصر مشتركة */
const accountOptions = (includeSections) => {
  const groups = new Map();
  S.chart.forEach((account) => {
    const key = account.sectionCode ? `${account.sectionCode} — ${account.sectionName}` : 'بلا قسم';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(account);
  });
  let html = includeSections ? '<option value="">— اختر حساباً —</option>' : '';
  for (const [label, accounts] of groups) {
    html += `<optgroup label="${esc(label)}">`;
    accounts.forEach((account) => {
      html += `<option value="${esc(account.code)}">${esc(account.code)} — ${esc(account.name)}${account.requiresSubledger ? ' • طرف تحليلي' : ''}</option>`;
    });
    html += '</optgroup>';
  }
  return html;
};

const subledgerAccounts = () => S.chart.filter((account) => account.requiresSubledger);

function verdictCard(title, outcome, message, extraHtml) {
  return `<div class="verdict ${outcome}"><strong>${esc(title)}</strong> — ${esc(message || '')}
    ${extraHtml ? `<div class="small muted" style="margin-top:6px">${extraHtml}</div>` : ''}</div>`;
}

function violationList(list, label) {
  return (list || []).map((item) => `<div class="viol ${(label || 'info').toLowerCase()}">
    <div><strong>[${esc(item.ruleId || item.code)}]</strong> ${esc(item.messageAr)}</div>
    ${item.remedyAr ? `<div class="ar">العلاج: ${esc(item.remedyAr)}</div>` : ''}
    <div class="rid">${item.ruleId ? `المادة ${esc(item.articleNumber)}` : esc(item.code)}${item.lineIndex != null ? ` • السطر ${item.lineIndex + 1}` : ''}</div>
  </div>`).join('');
}

/* ------------------------------------------------------------------ 1) لوحة المعلومات */
function viewOverview() {
  const acc = S.demo.accounting;
  const fin = S.demo.financial;
  const trial = S.trial;
  const moved = (trial.rows || []).filter((row) => row.movementCount > 0);
  return `
  <div class="grid3">
    <div class="kpi"><div class="n">${num(acc.stats.accounts)}</div><div class="l">حساباً في دليل الحسابات الموحد • ${num(acc.stats.subledgerAccounts)} كوداً مساعداً</div></div>
    <div class="kpi"><div class="n">${num(S.entries.length)}</div><div class="l">قيداً مسجّلاً • ${num(trial.entriesPosted)} مُرحَّلاً</div></div>
    <div class="kpi"><div class="n">${money(trial.totals.debitMajor)}</div><div class="l">إجمالي المدين (ج.م) ${trial.balanced ? '• الميزان متوازن' : '• الميزان غير متوازن'}</div></div>
    <div class="kpi"><div class="n">${num(S.demo.stats.articles)}</div><div class="l">مادة في النظام الأساسي • ${num(S.demo.stats.rules)} قاعدة مميكنة</div></div>
    <div class="kpi"><div class="n">${num(fin.stats.rules)}</div><div class="l">قاعدة مالية (${num(fin.stats.gateRules)} منع) • ${num(fin.stats.thresholds)} عتبة</div></div>
    <div class="kpi"><div class="n">${num(S.statuteCoverage.coveragePercent)}%</div><div class="l">تغطية مواد النظام الأساسي بالقواعد</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h3>حالة البرنامج الآن</h3>
      <div class="chips">
        <span class="chip ${trial.balanced ? 'ok' : 'bad'}">ميزان المراجعة: ${trial.balanced ? 'متوازن' : 'غير متوازن'}</span>
        <span class="chip ${S.chain.valid ? 'ok' : 'bad'}">سلسلة القيود: ${S.chain.valid ? 'سليمة' : 'مكسورة'}</span>
        <span class="chip ${acc.grounding.ok ? 'ok' : 'bad'}">بوابة جاهزية الدليل: ${acc.grounding.ok ? 'سليمة' : 'مخالفة'}</span>
        <span class="chip ${fin.grounding.ok ? 'ok' : 'bad'}">بوابة اللائحة المالية: ${fin.grounding.ok ? 'سليمة' : 'مخالفة'}</span>
        <span class="chip ${S.demo.grounding.ok ? 'ok' : 'bad'}">تأسيس النظام الأساسي: ${S.demo.grounding.ok ? 'كل قاعدة بمادة' : 'مخالفة'}</span>
        <span class="chip">مرحلة البوابة: ${esc(S.stage)}</span>
      </div>
      <div class="small muted">${esc(trial.balancedAr || '')}</div>
      <div class="small muted">${esc(S.chain.messageAr || '')}</div>
      <h3 style="margin-top:14px">آخر القيود</h3>
      ${S.entries.length ? `<div class="scroll" style="max-height:230px"><table>
        <thead><tr><th>المرجع</th><th>التاريخ</th><th>البيان</th><th>المبلغ (ج.م)</th><th>الحالة</th></tr></thead>
        <tbody>${S.entries.slice(-8).reverse().map((entry) => `<tr>
          <td class="mono">${esc(entry.referenceNo)}</td><td>${esc(entry.date)}</td><td>${esc(entry.descriptionAr)}</td>
          <td>${money(entry.totalMinor / 100)}</td><td><span class="pill ${entry.status}">${esc(entry.status)}</span></td></tr>`).join('')}</tbody>
      </table></div>` : '<div class="empty">لا قيود بعد — ابدأ من «القيود اليومية».</div>'}
      <h3 style="margin-top:14px">الأرصدة المتحركة</h3>
      ${moved.length ? `<table class="scroll"><thead><tr><th>الكود</th><th>الحساب</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
        <tbody>${moved.map((row) => `<tr><td class="mono">${esc(row.accountCode)}</td><td>${esc(row.accountName)}</td>
        <td>${money(row.debitMajor)}</td><td>${money(row.creditMajor)}</td><td>${money(row.balanceMajor)}</td></tr>`).join('')}</tbody></table>`
        : '<div class="empty">لا حركات على الأرصدة بعد.</div>'}
    </div>

    <div class="panel">
      <h3>ثلاثة قرارات بيانات مطلوبة منك (لا تُحلّ بالاستنتاج)</h3>
      ${(acc.openItems || []).map((item) => `<div class="notice ${item.id === 'COA-ANOM-DUP-1111' ? 'bad' : ''}">
        <strong>${esc(item.id)}</strong> — ${esc(item.titleAr)}
        <div class="small muted">المطلوب: ${esc(item.requiredFieldsAr)}</div>
        <div class="small muted">الأثر: ${esc(item.impactAr)}</div>
      </div>`).join('')}
      <h3>مصدر البيانات</h3>
      <div class="small muted">الدليل: <span class="mono">${esc(acc.provenance.sourceFile)}</span></div>
      <div class="small muted">بصمة الملف: <span class="mono">${esc(acc.provenance.sourceFileSha256)}</span></div>
      <div class="small muted">صفوف المصدر: ${num(acc.provenance.rows)} • تاريخ التوليد: ${esc(acc.provenance.generatedAt)}</div>
      <h3>الاعتماد والنشر (النظام الأساسي)</h3>
      <div class="small muted">الاعتماد: ${esc(S.demo.document.ratifiedOn || '—')} • ${esc((S.demo.document.approvalEvidence || {}).noteAr || 'دليل مسح مختوم')}</div>
      <div class="small muted">النشر: ${esc((S.enforcement.gazette && S.enforcement.gazette.publicationRefAr) || 'غير مُدخل')}</div>
      <div class="small muted">بنود مفتوحة (وثيقة): ${(S.enforcement.openItems || []).map((item) => esc(item.id)).join('، ') || '—'}</div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ 2) القيود اليومية */
function lineRow(index) {
  const line = S.lines[index];
  return `<div class="line" data-i="${index}">
    <select class="acc">${accountOptions(false).replace(`value="${line.accountCode}"`, `value="${line.accountCode}" selected`)}</select>
    <input class="debit" type="number" min="0" step="0.01" placeholder="مدين" value="${line.debit || ''}" />
    <input class="credit" type="number" min="0" step="0.01" placeholder="دائن" value="${line.credit || ''}" />
    <input class="party" placeholder="الطرف التحليلي (اختياري)" value="${esc(line.partyName || '')}" />
    <button class="act small ghost remove">حذف</button>
  </div>`;
}

function renderLines() {
  const box = $('lines');
  if (!box) return;
  box.innerHTML = S.lines.map((_, index) => lineRow(index)).join('');
  box.querySelectorAll('.line').forEach((row) => {
    const index = Number(row.dataset.i);
    row.querySelector('.acc').onchange = (event) => { S.lines[index].accountCode = event.target.value; updateTotals(); };
    row.querySelector('.debit').oninput = (event) => { S.lines[index].debit = Number(event.target.value || 0); updateTotals(); };
    row.querySelector('.credit').oninput = (event) => { S.lines[index].credit = Number(event.target.value || 0); updateTotals(); };
    row.querySelector('.party').oninput = (event) => { S.lines[index].partyName = event.target.value; };
    row.querySelector('.remove').onclick = () => { S.lines.splice(index, 1); renderLines(); };
  });
  updateTotals();
}

function currentEntry() {
  return {
    date: $('entryDate').value || today(),
    descriptionAr: $('entryDesc').value.trim(),
    lines: S.lines.filter((line) => line.accountCode).map((line) => ({
      accountCode: line.accountCode,
      debit: Number(line.debit || 0),
      credit: Number(line.credit || 0),
      ...(line.partyName ? { partyName: line.partyName } : {}),
    })),
  };
}

function updateTotals() {
  const debit = S.lines.reduce((sum, line) => sum + Number(line.debit || 0), 0);
  const credit = S.lines.reduce((sum, line) => sum + Number(line.credit || 0), 0);
  const diff = Math.round((debit - credit) * 100) / 100;
  const box = $('lineTotals');
  if (box) {
    box.innerHTML = `<span class="chip ${diff === 0 && debit > 0 ? 'ok' : ''}">مدين ${money(debit)}</span>
      <span class="chip ${diff === 0 && debit > 0 ? 'ok' : ''}">دائن ${money(credit)}</span>
      <span class="chip ${diff === 0 && debit > 0 ? 'ok' : 'bad'}">${diff === 0 ? (debit > 0 ? 'متوازن' : 'لا مبالغ') : `فارق ${money(Math.abs(diff))}`}</span>`;
  }
}

async function submitEntry(mode) {
  const input = currentEntry();
  if (mode === 'validate') {
    const result = await post('/api/accounting/validate', input);
    const ok = !result.issues.length;
    $('entryVerdict').innerHTML = verdictCard('فحص القيد', ok ? 'ACCEPTED' : 'BLOCKED',
      ok ? 'القيد مستوفٍ: متوازن وكل حساب صالح للترحيل.' : 'القيد غير مستوفٍ — التفاصيل أدناه.',
      `مدين ${money(result.totalDebitMinor / 100)} • دائن ${money(result.totalCreditMinor / 100)} • الفارق ${money(Math.abs(result.differenceMinor) / 100)}`)
      + violationList(result.issues, 'blocked');
    return;
  }
  const created = await post('/api/accounting/entries', input);
  if (!created.ok) {
    $('entryVerdict').innerHTML = verdictCard('رفض الإنشاء', 'BLOCKED', created.messageAr, created.regulation ? esc(created.regulation.summaryAr) : '')
      + violationList(created.issues, 'blocked');
    return;
  }
  const regulation = created.regulation || {};
  $('entryVerdict').innerHTML = verdictCard('أُنشئ القيد', 'ACCEPTED', created.messageAr,
    `السلسلة: <span class="mono">${esc(created.entry.currentHash.slice(0, 32))}…</span> • فحص اللائحة: ${esc(regulation.summaryAr || 'غير منطبق')}`);
  S.lastEntryId = created.entry.id;
  if (mode === 'post') {
    const posted = await post(`/api/accounting/entries/${created.entry.id}/post`, {});
    $('entryVerdict').innerHTML += verdictCard('الترحيل', posted.ok ? 'ACCEPTED' : 'BLOCKED', posted.messageAr);
  }
  await loadAll();
  render();
}

async function runFinancialPayload(payload) {
  const result = await post('/api/financial/check', payload);
  const outcome = result.blocked.length ? 'BLOCKED' : result.warnings.length ? 'WARNED' : 'INFO';
  const missing = (result.completeness && result.completeness.missingFields) || [];
  $('finVerdict').innerHTML = verdictCard('نتيجة الفحص', outcome, result.summaryAr,
    `قواعد مُقيَّمة: ${num((result.evaluatedRules || []).length)} • اكتمال البيانات: ${num(result.completeness ? result.completeness.percent : 0)}%${missing.length ? ` • حقول ناقصة: ${missing.map(esc).join('، ')}` : ''}`)
    + violationList(result.blocked, 'blocked') + violationList(result.warnings, 'warned') + violationList(result.infos, 'info');
  await loadAll();
  render();
}

function bindFinancial() {
  view().querySelectorAll('[data-fin]').forEach((button) => {
    button.onclick = () => runFinancialPayload(FIN_PRESETS[Number(button.dataset.fin)].payload);
  });

    const payload = { action, amount: Number($('finAmount').value || 0), entityLevel: $('finLevel').value };

    if (action === 'SECONDMENT_REWARD') payload.ratioPercent = Number($('finRatio').value || 0);

/* ------------------------------------------------------------------ 9) محاكيا الفحص */
function payloadForm(prefix, payload) {
  const entries = Object.entries(payload);
  return `<div class="sim">${entries.map(([key, value]) => {
    const id = `${prefix}_${key}`;
    if (typeof value === 'boolean') {
      return `<label class="field" style="flex-direction:row;align-items:center;gap:6px"><input id="${id}" type="checkbox" ${value ? 'checked' : ''} /> <span class="small">${esc(key)}</span></label>`;
    }
    if (typeof value === 'number') {
      return `<div class="field"><label>${esc(key)}</label><input id="${id}" type="number" step="any" value="${value}" /></div>`;
    }
    if (key === 'action') {
      const actions = prefix === 'gov' ? (S.defaults.governanceActions || []) : (S.defaults.membershipActions || []);
      return `<div class="field"><label>${esc(key)}</label><select id="${id}">${actions.map((action) => `<option value="${esc(action)}" ${action === value ? 'selected' : ''}>${esc(action)}</option>`).join('')}</select></div>`;
    }
    if (value === null) {
      return `<div class="field"><label>${esc(key)}</label><input id="${id}" placeholder="اتركه فارغاً" /></div>`;
    }
    return `<div class="field"><label>${esc(key)}</label><input id="${id}" value="${esc(value)}" /></div>`;
  }).join('')}</div>`;
}

function collectPayload(prefix, template) {
  const payload = {};
  Object.entries(template).forEach(([key, value]) => {
    const element = $(`${prefix}_${key}`);
    if (!element) return;
    if (typeof value === 'boolean') payload[key] = element.checked;
    else if (typeof value === 'number') payload[key] = Number(element.value || 0);
    else if (value === null) payload[key] = element.value === '' ? null : element.value;
    else payload[key] = element.value;
  });
  return payload;
}

async function runCheck(kind, payload, boxId) {
  const result = await post(`/api/statute/check/${kind}`, payload);
  const outcome = result.blocked.length ? 'BLOCKED' : result.warnings.length ? 'WARNED' : 'INFO';
  $(boxId).innerHTML = verdictCard(`فحص ${kind === 'governance' ? 'الحكامة' : 'العضوية'}`, outcome, result.summaryAr,
    `قواعد مُقيَّمة: ${num((result.evaluatedRules || []).length)} • المرحلة: ${esc((result.enforcement && result.enforcement.stage) || S.stage)}${(result.requiresOverrideBy || []).length ? ` • تجاوز: ${result.requiresOverrideBy.map(esc).join('، ')}` : ''}`)
    + violationList(result.blocked, 'blocked') + violationList(result.warnings, 'warned') + violationList(result.infos, 'info');
  await loadAll();
  render();
}

function bindSimulators() {
  $('runGov').onclick = () => runCheck('governance', collectPayload('gov', S.defaults.governance), 'govVerdict');
