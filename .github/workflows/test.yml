name: Union Accounting ERP CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Accounting & System Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          # الاختبارات لا تحتاج ثنائيات Electron (تُبنى في workflow منفصل)
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Voice reply without Gemini key
        run: npm run test:voice-reply

      - name: Run Test Suite
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Bundle Server + smoke test (same server shipped in the Windows package)
        run: npm run build:server && node scripts/smoke-server-bundle.mjs
