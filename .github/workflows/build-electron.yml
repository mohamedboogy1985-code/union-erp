# ===== Union Financial ERP — بناء نسخة سطح المكتب (Electron / Windows x64) =====
#
# متى يعمل؟
#   - كل دفعة إلى main             → اختبارات + بناء + رفع الملفات كـ Artifacts (بدون نشر)
#   - دفع وسم إصدار v* (مثل v1.2.0) → اختبارات + بناء + إنشاء GitHub Release منشور بالملفات
#   - تشغيل يدوي (Run workflow)    → بناء + (اختيارياً) إنشاء Release كمسودة للمراجعة
#   - Pull Request يمس ملفات التغليف → بناء تحقق فقط
#
# الناتج: UnionERP-<version>-x64.exe          (مثبت NSIS)
#         UnionERP-Portable-<version>-x64.exe (نسخة محمولة بدون تثبيت)
#         SHA256SUMS.txt                      (بصمات التحقق)
#
# خطوات إصدار نسخة جديدة: docs/RELEASE.md

name: Build Electron Desktop App

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - 'electron/**'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/patch-electron-builder.mjs'
      - 'scripts/smoke-server-bundle.mjs'
      - '.github/workflows/build-electron.yml'
  workflow_dispatch:
    inputs:
      publish_draft_release:
        description: 'إنشاء GitHub Release كمسودة من هذا البناء (للمراجعة ثم النشر يدوياً)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: electron-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) بوابة الجودة: حزمة الاختبارات الكاملة على Linux (سريعة ومعتمدة في CI)
  #    تعمل أيضاً عند دفع الوسوم حيث لا يعمل workflow الاختبارات المعتاد.
  # ---------------------------------------------------------------------------
  test:
    name: Test Suite (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Run Test Suite
        run: npm test

  # ---------------------------------------------------------------------------
  # 2) بناء حزمة Windows x64: واجهة + خادم مجمّع + اختبار دخان + electron-builder
  # ---------------------------------------------------------------------------
  build-windows:
    name: Windows x64 (NSIS + Portable)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    env:
      # تخزين ثنائيات Electron وأدوات electron-builder داخل مساحة العمل لتسريع البناءات التالية
      ELECTRON_CACHE: ${{ github.workspace }}\.cache\electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\.cache\electron-builder
      # لا توجد شهادة توقيع — تعطيل الاكتشاف التلقائي حتى لا يتوقف البناء
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Resolve version and validate release tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PRERELEASE=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [[ "$TAG" != "$VERSION" ]]; then
              echo "::error::الوسم v$TAG لا يطابق إصدار package.json ($VERSION). حدّث الإصدار بـ 'npm version' قبل دفع الوسم."
              exit 1
            fi
            [[ "$TAG" == *-* ]] && PRERELEASE=true
          fi
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Building Union Financial ERP v$VERSION (prerelease=$PRERELEASE)"

      - name: Build Frontend (Vite)
        run: npm run build:frontend

      - name: Bundle Server (esbuild)
        run: npm run build:server

      - name: Smoke-test bundled server (same server the Windows package runs)
        run: node scripts/smoke-server-bundle.mjs

      - name: Package Windows installer + portable (electron-builder)
        run: npx electron-builder --win nsis portable --publish never

      - name: Verify artifacts and generate SHA256 checksums
        shell: bash
        working-directory: release
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ls -la
          test -f "UnionERP-${VERSION}-x64.exe" || { echo "::error::مثبت NSIS غير موجود: UnionERP-${VERSION}-x64.exe"; exit 1; }
          test -f "UnionERP-Portable-${VERSION}-x64.exe" || { echo "::error::النسخة المحمولة غير موجودة: UnionERP-Portable-${VERSION}-x64.exe"; exit 1; }
          sha256sum *.exe > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: UnionERP-Windows-x64-${{ steps.meta.outputs.version }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3) النشر: وسم v* → Release منشور؛ تشغيل يدوي مع الخيار → Release مسودة
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: build-windows
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_draft_release)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: UnionERP-Windows-x64-${{ needs.build-windows.outputs.version }}
          path: release

      - name: Compose release notes (Arabic)
        shell: bash
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          {
            echo "## Union Financial ERP v${VERSION} — نسخة سطح المكتب Windows x64"
            echo
            echo "| الملف | الوصف |"
            echo "|------|-------|"
            echo "| \`UnionERP-${VERSION}-x64.exe\` | مثبت NSIS (اختيار مسار التثبيت + اختصارات سطح المكتب وقائمة ابدأ) |"
            echo "| \`UnionERP-Portable-${VERSION}-x64.exe\` | نسخة محمولة تعمل بدون تثبيت |"
            echo "| \`SHA256SUMS.txt\` | بصمات SHA-256 للتحقق من سلامة الملفات |"
            echo
            echo "> يعمل النظام فوراً بلا إنترنت وبلا قاعدة بيانات خارجية (وضع الذاكرة الداخلية)،"
            echo "> ويتصل بـ PostgreSQL والخدمات الذكية عند ضبط ملف \`.env\` — راجع \`docs/ELECTRON.md\`."
            echo
            echo "### بصمات التحقق (SHA-256)"
            echo '```'
            cat release/SHA256SUMS.txt
            echo '```'
            echo
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.build-windows.outputs.version) }}
          name: Union Financial ERP v${{ needs.build-windows.outputs.version }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          # التشغيل اليدوي ينشئ مسودة للمراجعة؛ دفع الوسم ينشر مباشرة
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ needs.build-windows.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build-windows.outputs.prerelease != 'true' && github.event_name != 'workflow_dispatch' }}
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
